<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset AWRC Logbook Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">AWRC LOGBOOK</p>
      <h1>Reset Password</h1>
    </section>
    <section class="panel">
      <form class="admin-login" id="resetPasswordForm">
        <label>New password <input id="newPassword" type="password" autocomplete="new-password" required></label>
        <label>Confirm password <input id="confirmPassword" type="password" autocomplete="new-password" required></label>
        <button class="submit" type="submit">Save new password</button>
        <p class="form-message admin-message" id="resetPasswordStatus" role="status"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#resetPasswordForm");
    const status = document.querySelector("#resetPasswordStatus");
    const token = new URLSearchParams(window.location.search).get("token") || "";
    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const nextPassword = document.querySelector("#newPassword")?.value || "";
      const confirmPassword = document.querySelector("#confirmPassword")?.value || "";
      if (!token) {
        status.textContent = "Reset link is missing or invalid.";
        status.className = "form-message admin-message show error";
        return;
      }
      if (nextPassword !== confirmPassword) {
        status.textContent = "Passwords do not match.";
        status.className = "form-message admin-message show error";
        return;
      }
      const response = await fetch("/api/admin/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, nextPassword }),
      });
      const data = await response.json().catch(() => ({}));
      status.textContent = response.ok ? "Password reset. You can return to the Logbook and sign in." : data.error || "Password could not be reset.";
      status.className = `form-message admin-message show ${response.ok ? "success" : "error"}`;
      if (response.ok) form.reset();
    });
  </script>
</body>
</html>
