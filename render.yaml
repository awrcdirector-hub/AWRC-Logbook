services:
  - type: web
    name: awrc-training-signup
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: TRAINING_STATE_FILE
        value: /tmp/awrc-training-state.json
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: NOTIFICATION_PROVIDER
        sync: false
      - key: NOTIFICATION_API_KEY
        sync: false
